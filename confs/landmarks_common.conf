include "wmask.conf"
train {
    end_iter = 30000
    seed = 42
}
landmarks {
    enabled = true
    num_landmarks = 3
    ids = [1, 33, 291]
    names = [nose_tip, eye_corner_mp33, mouth_corner_mp291]
    hidden_dims = [128, 64]
    annotation_path = ./annotations/CASE_NAME/mediapipe_reliable_v2.json
    sigma = 12.0
    balance_positive_negative = true
    positive_weight = 10.0
    negative_weight = 1.0
    loss_weight = 0.1
    initial_weight_ratio = 0.1
    weight_ramp_iters = 1000
    center_fraction = 0.1875
    negative_fraction = 0.0625
    center_sigma = 1.0
    annotated_image_fraction = 0.5
    geometry_warmup_iters = 10000
    landmark_warmup_iters = 5000
    joint_iters = 15000
    lr_factor_floor = 0.001
    gradient_log_freq = 100
    visualization_freq = 2500
    validation_resolution_level = 16
    export_freq = 0
    export_resolution = 256
    export_chunk_size = 8192
    marker_radius = 0.01
    # Optional normalized-coordinate bounding box per semantic name or ID:
    # search_bounds { nose_tip = [[-0.4,-0.4,-1.0],[0.4,0.5,0.0]] }
}
