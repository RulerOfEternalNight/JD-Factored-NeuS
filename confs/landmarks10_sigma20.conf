include "landmarks_common.conf"
landmarks {
    num_landmarks = 10
    # Preserve the original three classes first: 1, 33, 291.
    ids = [1, 33, 291, 263, 133, 362, 61, 10, 168, 152]
    names = [nose_tip, outer_eye_corner_mp33, mouth_corner_mp291,
             outer_eye_corner_mp263, inner_eye_corner_mp133,
             inner_eye_corner_mp362, mouth_corner_mp61,
             forehead_center_mp10, nose_bridge_mp168, chin_mp152]
    annotation_path = ./annotations/CASE_NAME/mediapipe_478_v3.json
    sigma = 20.0
    validation_resolution_level = 4
    extraction_method = multiview
    multiview {
        max_views = 12
        resolution_level = 4
        peaks_per_view = 8
        min_views = 3
        min_response = 0.05
        min_relative_response = 0.5
        min_support_fraction = 0.5
        min_camera_spread_degrees = 10.0
        min_peak_contrast = 2.0
        visibility_tolerance = 0.02
        visibility_chunk_size = 16
        proposal_neighbors = 32
        proposal_radius = 0.03
        field_candidates = 32
    }
}
