include "staged_10_sigma20.conf"
# New experiment; original sigma-20 results and configuration remain reproducible.
general.base_exp_dir_geo = ./exp/CASE_NAME/staged_10_corrected/geometry
landmarks {
    render_domain = unit_sphere
    positive_weight = 1.0
    negative_weight = 1.0
    nonlandmark {
        enabled = true
        weight = 0.1
        minimum_opacity = 0.5
        maximum_target = 0.01
        detach_visibility = true
    }
    hard_negatives {
        enabled = true
        capacity = 1024
        sample_fraction = 0.75
    }
    visibility {
        enabled = true
        cache_path = ./annotations/CASE_NAME/staged10_visibility_baseline10k.json
        reference_mesh = ./exp/CASE_NAME/baseline/geometry/meshes/00010000.ply
        mesh_coordinates = world
        tolerance = 0.02
        maximum_reprojection_error = 60.0
        maximum_surface_distance = 0.05
    }
    multiview {
        score_mode = visible_mean
        domain = unit_sphere
        save_heatmaps = true
    }
}
